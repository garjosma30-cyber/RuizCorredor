name: Publicar en OVH

# Cada cambio en www/ que llega a main se sube por FTP a /www del alojamiento.
# Solo sube los archivos añadidos o modificados: nunca borra nada del servidor
# ni toca archivos que no estén en www/ (por ejemplo, los PHP).
# Lanzarlo a mano ("Run workflow") solo comprueba la conexión y compara www/ con el servidor.
# Necesita el secreto FTP_PASSWORD (Settings → Secrets and variables → Actions).

on:
  push:
    branches: [main]
    paths: ['www/**']
  workflow_dispatch:

concurrency:
  group: ovh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ftp.cluster129.hosting.ovh.net
      FTP_USERNAME: garciat
      LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      EVENTO: ${{ github.event_name }}
      ANTES: ${{ github.event.before }}
      AHORA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Preparar lista de archivos
        run: |
          if [ "$EVENTO" = push ]; then
            if [ -z "$ANTES" ] || [ "$ANTES" = 0000000000000000000000000000000000000000 ]; then
              : > lista.txt
            else
              git diff --name-only --diff-filter=AMR "$ANTES" "$AHORA" -- www/ > lista.txt
            fi
          else
            git ls-files www/ > lista.txt
          fi
          echo "Archivos: $(wc -l < lista.txt)"
          cat lista.txt

      - name: Subir a OVH
        if: github.event_name == 'push'
        run: |
          [ -s lista.txt ] || { echo "Nada que subir"; exit 0; }
          {
            echo "set cmd:fail-exit yes; set net:max-retries 2; set net:timeout 30"
            echo "open --env-password -u $FTP_USERNAME $FTP_SERVER"
            sed 's#^www/##' lista.txt | while read -r f; do
              d=$(dirname "$f")
              [ "$d" != . ] && echo "mkdir -p -f \"/www/$d\""
              echo "put -O \"/www/$d\" \"www/$f\""
            done
          } > subir.lftp
          lftp -f subir.lftp
          echo "Subidos $(wc -l < lista.txt) archivo(s)."

      - name: Comprobar conexión y comparar con el servidor
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p servidor
          {
            echo "set net:max-retries 2; set net:timeout 30"
            echo "open --env-password -u $FTP_USERNAME $FTP_SERVER"
            sed 's#^www/##' lista.txt | while read -r f; do
              echo "get -O \"servidor/$(dirname "$f")\" \"/www/$f\""
            done
          } > bajar.lftp
          lftp -f bajar.lftp > /dev/null 2>&1 || true
          iguales=0; distintos=0; faltan=0
          while read -r f; do
            r=${f#www/}
            if [ ! -f "servidor/$r" ]; then echo "NO ESTÁ EN EL SERVIDOR: $r"; faltan=$((faltan+1))
            elif cmp -s "$f" "servidor/$r"; then iguales=$((iguales+1))
            else echo "DISTINTO: $r"; distintos=$((distintos+1)); fi
          done < lista.txt
          echo "Iguales: $iguales · Distintos: $distintos · No están en el servidor: $faltan"
          [ "$iguales" -gt 0 ] || { echo "No se pudo descargar nada: revisa la conexión o el secreto FTP_PASSWORD."; exit 1; }
